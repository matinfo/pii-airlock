# pii-airlock default configuration.
# Override at ~/.config/pii-airlock/config.yaml or project ./.pii-airlock.yaml,
# then by CLI flags (highest priority).

# Languages to detect. Each must have an entry in `models` below and the
# corresponding spaCy model installed (`pii-airlock download-models`).
languages:
  - en
  - fr

# Map language code -> spaCy model. Add a language by installing its model
# (python -m spacy download <model>) and adding a line here.
models:
  en: en_core_web_lg
  fr: fr_core_news_lg

# Minimum confidence (0.0–1.0) for a detection to count.
score_threshold: 0.5

# Entity types to scrub. Empty list = all entities Presidio recognizes.
# Examples: PERSON, EMAIL_ADDRESS, PHONE_NUMBER, CREDIT_CARD, IP_ADDRESS,
#           IBAN_CODE, LOCATION, URL, DATE_TIME
entities: []

# Default decision returned by the Claude Code hooks when PII is found:
#   ask  -> surface the PII and let the user confirm (recommended)
#   deny -> block the action / prompt outright
hook_decision: ask

# What the UserPromptSubmit hook does when your prompt contains PII.
# (Claude Code cannot "ask" on prompts: the prompt is either blocked or sent.)
#   block -> stop the prompt and show you a scrubbed version to send instead
#   warn  -> send the prompt anyway, with a warning (PII still leaves your machine)
prompt_decision: block

# What the hooks do when detection itself fails (e.g. spaCy model missing):
#   closed -> treat the input as containing PII (ask/deny/block as configured)
#   open   -> let it through unchecked
hook_on_error: closed

# Largest file (bytes) the PreToolUse hook scans when Claude reads a file.
# Larger files are treated like a detection failure (see hook_on_error).
hook_max_file_bytes: 2000000

# The gateway refuses request bodies it does not know how to scrub (fail closed).
# List path fragments ("<provider>/<path>") whose bodies may be forwarded raw,
# e.g. endpoints you know carry no personal data:
#   passthrough_paths:
#     - openai/v1/files
passthrough_paths: []

# Mapping storage backend (advanced):
#   memory -> process-local ephemeral mappings (default; fastest)
#   file   -> save mappings under `mapping_dir` or ~/.local/state/pii-airlock/maps
mapping_backend: memory

# Optional directory for mapping_backend: file
# mapping_dir: /absolute/path/to/pii-airlock-maps
