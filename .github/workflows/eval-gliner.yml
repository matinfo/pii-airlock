name: Eval (GLiNER)

# The GLiNER backend needs PyTorch and a ~1.1 GB model, too heavy for every push.
# Weekly, and on demand, it runs the same labeled corpus against
# tests/eval/thresholds-gliner.json.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-gliner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gliner-${{ hashFiles('pii_scrub/config.py') }}
      - name: Install (CPU torch, gliner extra)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,gliner]"
          python -m spacy download en_core_web_sm
      - name: Eval gate (GLiNER)
        run: python -m tests.eval.run_eval --backend gliner --gate -v
